name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: ./checks.sh
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # `+nightly` on every command: rust-toolchain.toml pins the crate to 1.99.1.
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Run each fuzz target for 30 seconds
        run: |
          for target in fuzz/fuzz_targets/*.rs; do
            cargo +nightly fuzz run "$(basename "$target" .rs)" -- -max_total_time=30
          done
